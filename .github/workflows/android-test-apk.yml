name: Android test APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Public HTTPS API origin (host only, without /api)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build standalone Android test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_BASE_URL: ${{ inputs.api_base_url }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate API base URL
        run: |
          node <<'NODE'
          const raw = process.env.EXPO_PUBLIC_API_BASE_URL;
          let url;
          try {
            url = new URL(raw);
          } catch {
            console.error("api_base_url must be an absolute HTTPS origin.");
            process.exit(1);
          }
          if (
            url.protocol !== "https:" ||
            !url.hostname ||
            url.username ||
            url.password ||
            url.pathname !== "/" ||
            url.search ||
            url.hash
          ) {
            console.error("api_base_url must be an HTTPS origin without a path, query, or credentials.");
            process.exit(1);
          }
          NODE

      - name: Generate Android project
        run: pnpm --filter @workspace/quietlink exec expo prebuild --platform android --no-install
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"

      - name: Build standalone test APK
        working-directory: artifacts/quietlink/android
        # The React Native Gradle plugin intentionally omits JavaScript from
        # the default debug variant. A release variant is bundled and still
        # installable because Expo prebuild signs it with the debug test key.
        run: >-
          ./gradlew --no-daemon --stacktrace
          -Pandroid.enableMinifyInReleaseBuilds=false
          -Pandroid.enableShrinkResourcesInReleaseBuilds=false
          assembleRelease

      - name: Verify APK contains the app bundle
        working-directory: artifacts/quietlink/android
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          if ! unzip -Z1 "$apk" | grep -Fxq "assets/index.android.bundle"; then
            echo "::error::The standalone APK is missing its embedded JavaScript bundle."
            exit 1
          fi

      - name: Upload standalone test APK
        uses: actions/upload-artifact@v4
        with:
          name: Hidden-Messenger-Android-test-${{ github.run_number }}
          path: artifacts/quietlink/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
