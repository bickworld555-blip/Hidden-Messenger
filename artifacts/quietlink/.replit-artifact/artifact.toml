kind = "mobile"
previewPath = "/"
title = "Hidden Messenger"
description = "A cross-platform private messaging app prototype for people who want familiar chat, call, status, and media-sharing flows with encrypted local history and transparent privacy controls."
version = "1.0.0"
id = "artifacts/quietlink"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18706

[services.development]
run = "pnpm --filter @workspace/quietlink run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/quietlink", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/quietlink", "run", "serve" ]

[services.env]
PORT = "18706"
BASE_PATH = "/"
